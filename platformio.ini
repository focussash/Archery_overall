[platformio]
default_envs = primary

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

[env:primary]
board = m5stick-c
board_build.partitions = huge_app.csv
build_flags =
    -DROLE_PRIMARY
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
build_src_filter = +<main_primary.cpp>
lib_deps =
    m5stack/M5Unified
    h2zero/NimBLE-Arduino

[env:secondary]
board = m5stick-c
build_flags = -DROLE_SECONDARY
build_src_filter = +<main_secondary.cpp>
lib_deps =
    m5stack/M5Unified

[env:native_test]
platform = native
framework =
test_framework = unity
build_flags = -DNATIVE_TEST
lib_ignore = hal, feedback, display_ui, menu, ble_relay, espnow_comm, session
