[platformio]
default_envs = primary

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

[env:primary]
board = m5stick-c
build_flags = -DROLE_PRIMARY
build_src_filter = +<main_primary.cpp>
lib_deps =
    m5stack/M5Unified

[env:secondary]
board = m5stick-c
build_flags = -DROLE_SECONDARY
build_src_filter = +<main_secondary.cpp>
lib_deps =
    m5stack/M5Unified

[env:native_test]
platform = native
framework =
test_framework = unity
build_flags = -DNATIVE_TEST
lib_ignore = hal, feedback, display_ui, menu, ble_relay, espnow_comm, session
